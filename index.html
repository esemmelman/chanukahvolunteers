<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chanukah Carnival - November 8th</title>
<link rel="stylesheet" href="styles.css">
<script src="app.js" defer></script>
</head>
<body><main>
<header><h1>Chanukah Carnival - November 8th</h1><h2>SIGN UP FORM</h2></header>
<form id="signup">
<label class="line-field" for="full-name"><span>Name: <b>*</b></span><input id="full-name" name="full_name" autocomplete="name" maxlength="120" required></label>
<label class="line-field" for="email"><span>Email: <b>*</b></span><input id="email" name="email" type="email" autocomplete="email" maxlength="254" required></label>
<label class="line-field" for="phone"><span>Cell: <b>*</b></span><input id="phone" name="phone" type="tel" autocomplete="tel" maxlength="40" required></label>
<p class="options-note">Select one or more options</p>
<fieldset><legend>Set Up Game Booths 8:00 - 10:00 AM</legend>
<div class="slots">
<label class="slot-row"><input type="checkbox" name="slot" value="1" aria-label="Sign up for setup slot 1"><span>1.</span><span class="name-line" data-slot="1"></span></label>
<label class="slot-row"><input type="checkbox" name="slot" value="2" aria-label="Sign up for setup slot 2"><span>2.</span><span class="name-line" data-slot="2"></span></label>
<label class="slot-row"><input type="checkbox" name="slot" value="3" aria-label="Sign up for setup slot 3"><span>3.</span><span class="name-line" data-slot="3"></span></label>
<label class="slot-row"><input type="checkbox" name="slot" value="4" aria-label="Sign up for setup slot 4"><span>4.</span><span class="name-line" data-slot="4"></span></label>
<label class="slot-row"><input type="checkbox" name="slot" value="5" aria-label="Sign up for setup slot 5"><span>5.</span><span class="name-line" data-slot="5"></span></label>
</div>
</fieldset>
<fieldset><legend>Food Prep 9:00 AM - 11:00 AM</legend>
<div class="slots">
<label class="slot-row"><input type="checkbox" name="slot" value="6" aria-label="Food Prep 9:00 AM - 11:00 AM, slot 1"><span>1.</span><span class="name-line" data-slot="6"></span></label>
<label class="slot-row"><input type="checkbox" name="slot" value="7" aria-label="Food Prep 9:00 AM - 11:00 AM, slot 2"><span>2.</span><span class="name-line" data-slot="7"></span></label>
<label class="slot-row"><input type="checkbox" name="slot" value="8" aria-label="Food Prep 9:00 AM - 11:00 AM, slot 3"><span>3.</span><span class="name-line" data-slot="8"></span></label>
<label class="slot-row"><input type="checkbox" name="slot" value="9" aria-label="Food Prep 9:00 AM - 11:00 AM, slot 4"><span>4.</span><span class="name-line" data-slot="9"></span></label>
<label class="slot-row"><input type="checkbox" name="slot" value="10" aria-label="Food Prep 9:00 AM - 11:00 AM, slot 5"><span>5.</span><span class="name-line" data-slot="10"></span></label>
</div>
</fieldset>
<fieldset><legend>Food Service 11:00 AM - 12:15 PM</legend>
<div class="slots">
<label class="slot-row"><input type="checkbox" name="slot" value="11" aria-label="Food Service 11:00 AM - 12:15 PM, slot 1"><span>1.</span><span class="name-line" data-slot="11"></span></label>
<label class="slot-row"><input type="checkbox" name="slot" value="12" aria-label="Food Service 11:00 AM - 12:15 PM, slot 2"><span>2.</span><span class="name-line" data-slot="12"></span></label>
<label class="slot-row"><input type="checkbox" name="slot" value="13" aria-label="Food Service 11:00 AM - 12:15 PM, slot 3"><span>3.</span><span class="name-line" data-slot="13"></span></label>
<label class="slot-row"><input type="checkbox" name="slot" value="14" aria-label="Food Service 11:00 AM - 12:15 PM, slot 4"><span>4.</span><span class="name-line" data-slot="14"></span></label>
<label class="slot-row"><input type="checkbox" name="slot" value="15" aria-label="Food Service 11:00 AM - 12:15 PM, slot 5"><span>5.</span><span class="name-line" data-slot="15"></span></label>
</div>
</fieldset>
<fieldset><legend>Food Service 12:15 PM - 1:30 PM</legend>
<div class="slots">
<label class="slot-row"><input type="checkbox" name="slot" value="16" aria-label="Food Service 12:15 PM - 1:30 PM, slot 1"><span>1.</span><span class="name-line" data-slot="16"></span></label>
<label class="slot-row"><input type="checkbox" name="slot" value="17" aria-label="Food Service 12:15 PM - 1:30 PM, slot 2"><span>2.</span><span class="name-line" data-slot="17"></span></label>
<label class="slot-row"><input type="checkbox" name="slot" value="18" aria-label="Food Service 12:15 PM - 1:30 PM, slot 3"><span>3.</span><span class="name-line" data-slot="18"></span></label>
</div>
</fieldset>
<fieldset><legend>Food Clean Up 1:30 PM - 2:30 PM</legend>
<div class="slots">
<label class="slot-row"><input type="checkbox" name="slot" value="19" aria-label="Food Clean Up 1:30 PM - 2:30 PM, slot 1"><span>1.</span><span class="name-line" data-slot="19"></span></label>
<label class="slot-row"><input type="checkbox" name="slot" value="20" aria-label="Food Clean Up 1:30 PM - 2:30 PM, slot 2"><span>2.</span><span class="name-line" data-slot="20"></span></label>
<label class="slot-row"><input type="checkbox" name="slot" value="21" aria-label="Food Clean Up 1:30 PM - 2:30 PM, slot 3"><span>3.</span><span class="name-line" data-slot="21"></span></label>
</div>
</fieldset>
<p id="load-status" role="status">Loading saved names…</p>
<div class="actions"><button type="submit">Submit</button><button type="reset" class="secondary">Cancel</button></div>
<p id="status" role="status" aria-live="polite"></p>
</form>
</main></body></html>
